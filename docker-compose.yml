version: '3.6'
# The SHR (shared health record): the central HAPI FHIR server the OpenELIS
# instances send their data to. Start it first: it creates the
# shr-pipeline-network the pipeline controllers join.
services:
    shr-hapi-fhir:
        container_name: shr-hapi-fhir
        image: hapiproject/hapi:v5.5.1
        depends_on:
            shr-db:
                condition: service_healthy
        ports:
            - "${SHR_PORT:-8090}:8080"
        restart: always
        environment:
            - hapi.fhir.auto_create_placeholder_reference_targets=true
            - hapi.fhir.allow_placeholder_references=true
            - hapi.fhir.allow_external_references=true
            - hapi.fhir.client_id_strategy=ANY
            - hapi.fhir.mdm_enabled=false
            - spring.datasource.url=jdbc:postgresql://shr-db:5432/hapi
            - spring.datasource.username=admin
            - spring.datasource.password=admin
            - spring.datasource.driverClassName=org.postgresql.Driver
        networks:
            - shr-pipeline-network
        volumes:
            - hapi-data:/data/hapi

    shr-db:
        image: postgres:14.4
        container_name: hapi-fhir-db
        restart: always
        environment:
            POSTGRES_DB: 'hapi'
            POSTGRES_USER: 'admin'
            POSTGRES_PASSWORD: 'admin'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d hapi"]
            interval: 10s
            timeout: 5s
            retries: 10
        volumes:
            - hapi-fhir-db:/var/lib/postgresql/data
        networks:
            - shr-pipeline-network

networks:
  shr-pipeline-network:
    name: shr-pipeline-network

volumes:
  hapi-data:
  hapi-fhir-db:
